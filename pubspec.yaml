name: aicycle_on_device
description: "An AICycle On-Device SDK for Flutter."
version: 0.1.3
homepage:

environment:
  sdk: ^3.6.1
  # Native YOLO inference is bundled in this package; the Android side needs a
  # recent AGP/Gradle toolchain, so require a matching Flutter floor.
  flutter: ">=3.32.1"

dependencies:
  dio: ^5.9.2
  flutter:
    sdk: flutter
  # for geocoding and geolocator
  geocoding: ^4.0.0
  geolocator: ^14.0.2

  # for device orientation
  native_device_orientation: ^2.1.0

  path_provider: ^2.1.5

  gallery_saver_plus: ^3.2.9
  permission_handler: ^11.3.1
  wakelock_plus: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # This package bundles its own native YOLO inference (previously the separate
  # aicycle_yolo plugin). Channel namespace: com.aicycle.yolo
  plugin:
    platforms:
      android:
        package: com.aicycle.yolo
        pluginClass: YOLOPlugin
      ios:
        pluginClass: YOLOPlugin
  assets:
    - assets/images/
